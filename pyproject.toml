[project]
name = "openarena-perception"
version = "0.1.0"
description = "Brain-inspired AI bot framework for OpenArena"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.0",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3",
    "numpy>=1.26",
    "ollama>=0.6",
    "pynput>=1.7",
    "pygame>=2.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.13",
    "structlog>=24.0",
    "aiosqlite>=0.22.1",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.18.4",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.19",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "hypothesis>=6.151.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.15",
]
